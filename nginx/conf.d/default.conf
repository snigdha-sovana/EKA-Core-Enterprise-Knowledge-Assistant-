# -----------------------------------------------------------------------------
# Upstream Definitions with Connection Pooling
# -----------------------------------------------------------------------------
upstream api_upstream {
    server api:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:5173;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# Edge Rate Limiting Zones (Defense-in-Depth Layer 1)
# -----------------------------------------------------------------------------
# General API rate limit: 30 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

# Authentication brute-force protection: 5 requests/minute per IP
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;

# RAG vector query rate limit: 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=rag_query:10m rate=10r/s;

# Connection limit: Maximum 25 concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Maximum concurrent connections per IP address
    limit_conn addr_conn 25;
    limit_req_status 429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # Enterprise Security Headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss: http: https:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


    # Default proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # -------------------------------------------------------------------------
    # Healthcheck Endpoint (No rate limiting, high frequency allowed)
    # -------------------------------------------------------------------------
    location = /healthz {
        proxy_pass http://api_upstream/healthz;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Authentication (Strict Rate Limiting against Brute-Force & Credential Stuffing)
    # -------------------------------------------------------------------------
    location ~ ^/auth/(login|token) {
        limit_req zone=auth_login burst=2 nodelay;
        proxy_pass http://api_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /auth/ {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://api_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # -------------------------------------------------------------------------
    # Real-Time RAG Streaming (Server-Sent Events)
    # -------------------------------------------------------------------------
    location = /query/stream {
        limit_req zone=rag_query burst=5 nodelay;

        # Disable buffering and chunking caches for instantaneous token delivery
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep streaming connection alive for long generation responses
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_pass http://api_upstream/query/stream;
    }

    # -------------------------------------------------------------------------
    # RAG Vector Retrieval & Inference Queries
    # -------------------------------------------------------------------------
    location = /query {
        limit_req zone=rag_query burst=10 nodelay;
        proxy_pass http://api_upstream/query;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Backend Enterprise APIs (Departments, Documents, Escalations, ERP)
    # -------------------------------------------------------------------------
    location ~ ^/(documents|departments|escalations|erp|metrics|docs|openapi\.json|redoc) {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://api_upstream;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Frontend Single-Page Application & Static Assets (React / Vite)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;

        # WebSocket & Hot Module Replacement support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # Custom 429 JSON Error Page for API consumers
    # -------------------------------------------------------------------------
    error_page 429 /429.json;
    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Please slow down and try again later.","retry_after_seconds":60}';
    }
}
